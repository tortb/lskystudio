name: Build Lsky Studio

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS：在 Apple Silicon runner 上构建 universal 包，一份产物同时覆盖 arm64 与 x86_64
          - name: macOS (arm64 + x86_64)
            platform: macos-latest
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            args: "--target universal-apple-darwin"
          # Linux x86_64
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            rust-targets: "x86_64-unknown-linux-gnu"
            args: "--target x86_64-unknown-linux-gnu --bundles deb,appimage"
          # Linux arm64
          - name: Linux (arm64)
            platform: ubuntu-22.04-arm
            rust-targets: "aarch64-unknown-linux-gnu"
            args: "--target aarch64-unknown-linux-gnu --bundles deb,appimage"
          # Windows x86_64
          - name: Windows (x86_64)
            platform: windows-latest
            rust-targets: "x86_64-pc-windows-msvc"
            args: "--target x86_64-pc-windows-msvc --bundles msi,nsis"
          # Windows arm64（Tauri 在 Windows arm64 上仅支持 NSIS 打包）
          - name: Windows (arm64)
            platform: windows-11-arm
            rust-targets: "aarch64-pc-windows-msvc"
            args: "--target aarch64-pc-windows-msvc --bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.rust-targets }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 仅 tag 推送时创建/更新 Release；手动触发只构建产物，避免用分支名当 tag
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: "Lsky Studio ${{ github.ref_name }}"
          releaseBody: "See the assets below to download the installer for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
